name: regatta
type: db
description: Deploy Regatta distributed database via the custom Regatta Operator
version: "1.0.0"
collision-check: true

runtime:
  type: pods
  selector: "app.kubernetes.io/name=regatta"
  namespace: ${NAMESPACE}

endpoints:
  - name: "Regatta RDB"
    node-type: db
    port: 30850
    type: native
  - name: "Regatta SM"
    node-type: db
    port: 30840
    type: http

args:
  - flag: --version
    variable: REGATTA_VERSION
    description: "Regatta image version tag"
    type: string
    default: "26.0.0.789"
  - flag: --regatta-repo
    variable: REGATTA_IMAGE_REPOSITORY
    description: "Regatta DB container image repository"
    type: string
    default: "694992585570.dkr.ecr.us-west-2.amazonaws.com/reg-k8s/regatta"
  - flag: --operator-image
    variable: REGATTA_OPERATOR_IMAGE
    description: "Regatta Operator container image"
    type: string
    default: "694992585570.dkr.ecr.us-west-2.amazonaws.com/reg-k8s/operator:26.0.0.789"
  - flag: --replicas
    variable: REPLICAS
    description: "Number of RDB replicas (default: db node count)"
    type: int
    default: "${DB_NODE_COUNT}"
  - flag: --size
    variable: STORAGE_SIZE
    description: "Storage size per node for RDB block storage"
    type: string
    default: "1Ti"
  - flag: --rdb-device
    variable: RDB_DEVICE
    description: "Path to raw block or loop device on DB node for RDB storage"
    type: string
    default: "/dev/nvme4n1"
  - flag: --shm-size
    variable: SHM_SIZE
    description: "Memory-backed shared memory size"
    type: string
    default: "40Gi"
  - flag: --force-uninstall
    variable: FORCE_UNINSTALL
    description: "Force uninstall without interactive confirmation prompt"
    type: boolean
    default: "false"
  - flag: --rdb-threads
    variable: RDB_NUM_THREADS
    description: "Number of CPU worker threads for RDB (defaults to auto-detected optimal node CPU)"
    type: string
    default: ""
  - flag: --rdb-ram-mb
    variable: RDB_RAM_MB
    description: "Megabytes of RAM for RDB (defaults to auto-detected 80%% node RAM in MB)"
    type: string
    default: ""
  - flag: --sequencer-threads
    variable: SEQUENCER_NUM_THREADS
    description: "Number of CPU worker threads for Sequencer in SM (defaults to auto-detected optimal based on node CPU)"
    type: string
    default: ""
  - flag: --namespace
    variable: NAMESPACE
    description: "Kubernetes namespace for Regatta cluster and operator"
    type: string
    default: "regatta"
  - flag: --sm-node-type
    variable: SM_NODE_TYPE
    description: "Node pool (type label) that hosts the SM pod; falls back to the control node when no match exists"
    type: string
    default: "app"
  - flag: --sm-node-ordinal
    variable: SM_NODE_ORDINAL
    description: "Node ordinal within the SM node pool; empty means any node in that pool"
    type: string
    default: "1"

install:
  - type: namespace
    name: ${NAMESPACE}
  - type: manifest
    template: init-dirs-daemonset.yaml
  - type: manifest
    template: crd.yaml
  - type: manifest
    template: operator-rbac.yaml
  - type: manifest
    template: operator-deployment.yaml
  - type: wait
    kind: Deployment
    name: regatta-operator
    namespace: ${NAMESPACE}
    condition: Available
    timeout: "180s"
  - type: delete
    kind: DaemonSet
    name: regatta-dir-prep-${KIT_NAME}
    namespace: ${NAMESPACE}
  - type: shell
    script: bin/install.sh

start:
  - type: shell
    script: bin/start.sh
  - type: manifest
    template: regattacluster.yaml
  - type: shell
    script: bin/pin-sm-node.sh
  - type: manifest
    template: nodeport-service.yaml

stop:
  - type: delete
    kind: RegattaCluster
    name: ${KIT_NAME}
    namespace: ${NAMESPACE}
  - type: delete
    kind: Service
    name: ${KIT_NAME}-nodeport
    namespace: ${NAMESPACE}

uninstall:
  - type: delete
    kind: RegattaCluster
    name: ${KIT_NAME}
    namespace: ${NAMESPACE}
    ignore-not-found: true
  - type: delete
    kind: Service
    name: ${KIT_NAME}-nodeport
    namespace: ${NAMESPACE}
    ignore-not-found: true
  - type: shell
    script: bin/uninstall.sh
  - type: delete
    kind: Deployment
    name: regatta-operator
    namespace: ${NAMESPACE}
    ignore-not-found: true
  - type: delete
    kind: RoleBinding
    name: regatta-operator
    namespace: ${NAMESPACE}
    ignore-not-found: true
  - type: delete
    kind: Role
    name: regatta-operator
    namespace: ${NAMESPACE}
    ignore-not-found: true
  - type: delete
    kind: ServiceAccount
    name: regatta-operator
    namespace: ${NAMESPACE}
    ignore-not-found: true
  - type: delete
    kind: CustomResourceDefinition
    name: regattaclusters.regatta.dev
    ignore-not-found: true
