apiVersion: apps/v1
kind: Deployment
metadata:
  name: regatta-operator
  labels:
    app.kubernetes.io/name: regatta-operator
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: regatta-operator
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: regatta-operator
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: regatta-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: 694992585570.dkr.ecr.us-west-2.amazonaws.com/reg-k8s/operator:26.0.0.789
          imagePullPolicy: Always
          command: ["uv"]
          args:
            - run
            - kopf
            - run
            - --standalone
            - --namespace=$(POD_NAMESPACE)
            - --liveness=http://0.0.0.0:8080/healthz
            - -m
            - regatta_operator.main
          ports:
            - name: health
              containerPort: 8080
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 3
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: UV_CACHE_DIR
              value: /tmp/uv-cache
            - name: UV_NO_SYNC
              value: "1"
            - name: UV_NO_DEV
              value: "1"
            - name: USER
              value: operator
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
